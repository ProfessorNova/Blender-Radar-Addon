schema_version = "1.0.0"

id = "radar_addon"
version = "0.1.0"
name = "Radar Addon"
tagline = "Raytracing-based radar simulation"
maintainer = "Florian Wieland <mail@florianwieland.de>"
type = "add-on"
license = ["SPDX:GPL-3.0-or-later"]
blender_version_min = "5.0.0"
tags = ["Object", "Render", "Development"]

# Files that are not part of the shipped add-on. `blender --command extension
# build` reads these (gitignore-style, a leading "/" anchors to the repo root)
# so the packaged ZIP contains only the add-on, not the dev environment.
[build]
paths_exclude_pattern = [
    "__pycache__/",
    "*.pyc",
    "/.git/",
    "/.github/",
    "/.vscode/",
    "/.venv/",
    "/.pytest_cache/",
    "/tests/",
    "/pyproject.toml",
    "/*.zip",
]
